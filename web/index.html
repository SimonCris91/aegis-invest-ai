<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0b1014">
    <title>Aegis Invest AI</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">AEGIS INVEST AI</p>
          <h1>Decision workspace</h1>
        </div>
        <div class="read-only-mark"><span class="status-dot"></span> Read-only</div>
      </header>
      <div id="app" aria-live="polite">
        <section class="state-panel" data-state="loading">
          <span class="spinner" aria-hidden="true"></span>
          <p>Loading the latest scanner state...</p>
        </section>
      </div>
    </main>
    <script src="/app.js" defer></script>
  </body>
</html>
