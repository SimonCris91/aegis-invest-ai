name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Portable Python test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install project and dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Run portable tests
        run: >-
          python -m pytest --cov=app --cov-report=term-missing
          --deselect=tests/test_etoro_catalog_snapshot.py::test_local_dynamic_artifact_retains_catalog_and_only_ready_records
          --deselect=tests/test_etoro_catalog_snapshot.py::test_dynamic_loader_does_not_fallback_to_the_34_asset_baseline
          --deselect=tests/test_generated_windows_commands.py::test_generated_windows_commands_use_the_active_d_checkout
          --deselect=tests/test_security_invariants.py::test_mcp_write_tools_remain_disabled

  quality:
    name: Ruff and mypy (advisory)
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install project and dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy

  local-runtime-note:
    name: Local runtime invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Document local-only checks
        run: |
          echo "Four tests are intentionally excluded from hosted CI because they require the local D: checkout, generated eToro runtime artifacts, or the ignored .codex/config.toml."
          echo "They remain part of the full local verification suite documented in the repository."
